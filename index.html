<!DOCTYPE html>
<html lang="tr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YÖKAK · Kalite Güvencesi Ajansı Başvuru Sistemi</title>
    <meta
      name="description"
      content="YÖKAK — Ulusal akreditasyon ajansları için yetkilendirme, uluslararası ajanslar için tanınma başvuru sistemi. ESG 2027 (Draft 3) uyumlu."
    />
    <meta name="color-scheme" content="light dark" />

    <link rel="stylesheet" href="assets/css/tokens.css" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/glass.css" />
    <link rel="stylesheet" href="assets/css/app.css" />

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='16 48 172 102'%3E%3Cpath fill='%2374c3ef' d='M21 108h27q7 0 10 5l4 6-16 26z'/%3E%3Cpath fill='%231c7cc1' d='M134 75h-19q-7 0-11 6L63 137q-5 8 3 8h19z'/%3E%3Cpath fill='%232b4f8e' d='M182 53h-20q-7 0-11 6L96 137q-5 8 3 8h20z'/%3E%3C/svg%3E"
    />
  </head>

  <body>
    <!-- Ortam aurası / ambient background -->
    <div class="aurora" aria-hidden="true">
      <span class="aurora__blob aurora__blob--1"></span>
      <span class="aurora__blob aurora__blob--2"></span>
      <span class="aurora__blob aurora__blob--3"></span>
    </div>

    <a class="skip-link" href="#stepview">Ana içeriğe geç</a>

    <div class="app">
      <!-- ============================ ÜST BAR ============================ -->
      <header class="app-header glass">
        <a class="brand" href="#" onclick="return false">
          <!-- YÖKAK markası. Resmî SVG dosyanız varsa bu bloğun yerine koyunuz. -->
          <svg class="brand__mark" viewBox="16 48 172 102" aria-hidden="true">
            <path fill="var(--yk-mark-sky)" d="M21 108h27q7 0 10 5l4 6-16 26z" />
            <path fill="var(--yk-mark-blue)" d="M134 75h-19q-7 0-11 6L63 137q-5 8 3 8h19z" />
            <path fill="var(--yk-mark-navy)" d="M182 53h-20q-7 0-11 6L96 137q-5 8 3 8h20z" />
          </svg>
          <span class="brand__text">
            <span class="brand__name">YÖKAK</span>
            <span class="brand__sub" id="brand-sub">Başvuru Sistemi</span>
          </span>
        </a>

        <span class="app-header__divider" aria-hidden="true"></span>

        <span class="app-header__context">
          <span class="app-header__context-label" id="ctx-label">Başvuru</span>
          <span class="app-header__context-value" id="ctx-value">
            Kalite Güvencesi Ajansı Başvuru Formu
          </span>
        </span>

        <span class="app-header__spacer"></span>

        <div class="app-header__actions" id="header-actions"></div>
      </header>

      <!-- ============================ GÖVDE ============================= -->
      <div class="app-body">
        <aside class="app-sidebar" id="sidebar"></aside>

        <main class="app-main">
          <div class="tabbar-wrap">
            <nav class="tabbar glass" id="tabbar"></nav>
            <div id="topprogress"></div>
          </div>

          <div id="stepview"></div>
        </main>
      </div>
    </div>

    <!-- Bildirimler / toasts -->
    <div class="toast-region" id="toasts" aria-live="polite" aria-atomic="false"></div>

    <!-- Onay penceresi / confirm dialog -->
    <dialog class="modal" id="confirm-dialog"></dialog>

    <!-- ============================ BETİKLER ========================== -->
    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/esg-data.js"></script>
    <script src="assets/data/programs.js"></script>
    <script src="assets/data/yokak-criteria.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/validate.js"></script>
    <script src="assets/js/schema.js"></script>
    <script src="assets/js/fields.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
